<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="description" content="El catálogo profesional JISCO de Innova Boutique está en construcción.">
  <title>JISCO en construcción | Innova Boutique</title>
  <link rel="icon" type="image/png" href="../assets/innova-logo.png">
  <link rel="apple-touch-icon" href="../assets/innova-logo.png">
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body { min-height: 100svh; overflow-x: hidden; background: #102c40; color: #fff; font-family: Arial, Helvetica, sans-serif; }
    .film { position: fixed; inset: 0; overflow: hidden; background: #102c40 url('../assets/jisco-showcase/home_2.jpg') center center / cover no-repeat; }
    .film video { width: 100%; height: 100%; object-fit: cover; object-position: center; }
    .film::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(2,25,42,.88) 0%, rgba(2,25,42,.60) 44%, rgba(2,25,42,.20) 100%), linear-gradient(0deg, rgba(2,25,42,.54), transparent 35%); }
    .page { position: relative; z-index: 1; min-height: 100svh; display: flex; flex-direction: column; padding: clamp(24px, 4vw, 54px) clamp(24px, 6vw, 100px) 24px; }
    .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
    .innova { display: inline-flex; align-items: center; }
    .innova img { display: block; width: clamp(150px, 16vw, 210px); height: auto; filter: brightness(0) invert(1); }
    .brand { display: flex; align-items: flex-start; }
    .brand img { display: block; width: clamp(106px, 12vw, 170px); height: auto; filter: brightness(0) invert(1); }
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 830px; padding: 32px 0; }
    .eyebrow { margin: 0 0 24px; font-size: 11px; font-weight: 700; letter-spacing: .27em; text-transform: uppercase; }
    h1 { margin: 0; font-family: Georgia, 'Times New Roman', serif; font-size: clamp(58px, 8.8vw, 138px); font-weight: 400; line-height: .93; letter-spacing: -.055em; }
    .detail { max-width: 490px; margin: 32px 0 34px; color: rgba(255,255,255,.88); font-size: clamp(15px, 1.5vw, 19px); line-height: 1.55; }
    .back { align-self: flex-start; display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border: 1px solid rgba(255,255,255,.8); color: #fff; font-size: 10px; font-weight: 700; letter-spacing: .15em; text-decoration: none; text-transform: uppercase; transition: background .2s, color .2s; }
    .back:hover, .back:focus-visible { background: #fff; color: #102c40; }
    footer { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; color: rgba(255,255,255,.78); font-size: 10px; letter-spacing: .07em; }
    footer span:last-child { text-align: right; }
    @media (max-width: 640px) {
      .film video { object-position: 57% center; }
      .film::after { background: linear-gradient(0deg, rgba(2,25,42,.82) 0%, rgba(2,25,42,.40) 64%, rgba(2,25,42,.42)); }
      .page { padding: 22px 22px 20px; }
      .top { align-items: flex-start; }
      .innova img { width: 136px; }
      .brand img { width: 100px; }
      main { padding: 44px 0; }
      h1 { font-size: clamp(54px, 14vw, 78px); }
      .detail { margin-top: 24px; }
      footer { flex-direction: column; align-items: flex-start; gap: 6px; line-height: 1.4; }
      footer span:last-child { text-align: left; }
    }
    @media (prefers-reduced-motion: reduce) { .film video { display: none; } }
  </style>
</head>
<body>
  <div class="film" aria-hidden="true">
    <video autoplay muted playsinline loop preload="auto" poster="../assets/jisco-showcase/home_2.jpg">
      <source src="https://moissesb.github.io/innova-jisco-catalogo/assets/campaigns/jisco-home-marea-2026.mp4" type="video/mp4">
    </video>
  </div>
  <div class="page">
    <header class="top">
      <a class="innova" href="../#inicio" aria-label="Volver a Innova Boutique"><img src="../assets/innova-official.png" alt="Innova Boutique"></a>
      <div class="brand"><img src="../assets/jisco-logo-white.png" alt="JISCO"></div>
    </header>
    <main>
      <p class="eyebrow" id="eyebrow">JISCO · INNOVA BOUTIQUE</p>
      <h1 id="headline">Estamos en<br>construcción.</h1>
      <p class="detail" id="detail">Preparamos una nueva experiencia para descubrir JISCO en Innova Boutique. Muy pronto estará disponible.</p>
      <a class="back" id="back" href="../#inicio">Volver a Innova Boutique&nbsp; ↗</a>
    </main>
    <footer><span>© JISCO Eyewear</span><span id="footer-detail">Distribución profesional · Innova Boutique</span></footer>
  </div>
  <script>
    try {
      const language = localStorage.getItem('innova-boutique-language');
      const copy = {
        en: { headline: 'Coming<br>soon.', detail: 'We are preparing a new way to discover JISCO at Innova Boutique. The experience will be available soon.', back: 'Back to Innova Boutique&nbsp; ↗', footer: 'Professional distribution · Innova Boutique' },
        fr: { headline: 'Bientôt<br>disponible.', detail: 'Nous préparons une nouvelle expérience pour découvrir JISCO chez Innova Boutique. Elle sera bientôt disponible.', back: 'Retour à Innova Boutique&nbsp; ↗', footer: 'Distribution professionnelle · Innova Boutique' }
      }[language];
      if (copy) {
        document.documentElement.lang = language;
        document.getElementById('headline').innerHTML = copy.headline;
        document.getElementById('detail').textContent = copy.detail;
        document.getElementById('back').innerHTML = copy.back;
        document.getElementById('footer-detail').textContent = copy.footer;
      }
    } catch {}
  </script>
</body>
</html>
